<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      font-family: sans-serif;
      min-width: 200px;
      padding: 10px;
    }
    button {
      display: block;
      width: 100%;
      margin-top: 8px;
      padding: 8px;
      border: none;
      border-radius: 6px;
      background: #4a90e2;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    button.active {
      background: #1b6ae0;
    }
  </style>
</head>
<body>
  <h3>Choose Mode</h3>
  <button id="mode1">Mode 1 — Clanker</button>
  <button id="mode2">Mode 2 — Clank'a</button>
  <script src="popup.js"></script>
</body>
</html>
